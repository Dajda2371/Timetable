[project]
name = "timetable"
version = "0.1.0"
description = "A school timetable generator with a browser-based interface."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Beneš" }]
dependencies = [
    "fastapi",
    "ortools>=9.15,<9.16",
    "uvicorn",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
